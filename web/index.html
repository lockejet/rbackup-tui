<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>rbackup-ui</title>
<link rel="stylesheet" href="/style.css">
<script>
/* 尽早应用主题，避免闪烁 */
try {
  var t = localStorage.getItem('rbtui-theme');
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
</head>
<body>

<!-- 登录 -->
<div id="loginView" class="login-view">
  <form id="loginForm" class="login-card" autocomplete="off">
    <h1>
      <span>rbackup-ui <span id="loginVersion" class="ver"></span></span>
      <button type="button" id="loginThemeBtn" class="theme-btn" title="切换主题（自动/亮/暗）">🌓</button>
    </h1>

    <p class="hint" id="loginHint">正在获取登录方式…</p>

    <div id="passwordFields" class="fields hidden">
      <input id="userInput" name="username" placeholder="用户名" autocomplete="username"
             autocapitalize="off" autocorrect="off" spellcheck="false">
      <input id="passInput" name="password" type="password" placeholder="密码" autocomplete="current-password">
    </div>

    <div id="tokenFields" class="fields hidden">
      <input id="tokenInput" name="token" type="password" placeholder="token"
             autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>

    <div id="totpFields" class="fields hidden">
      <p class="hint small">密码正确。请输入认证器 App 里的 6 位动态码：</p>
      <input id="totpInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="123456"
             autocomplete="one-time-code" class="totp-input">
    </div>

    <button type="submit" class="primary" id="loginBtn">登录</button>
    <p id="loginError" class="error hidden"></p>
    <p class="hint small" id="loginFoot"></p>
    <p class="hint small"><button type="button" id="switchAuthBtn" class="link hidden">改用 token 登录</button></p>
  </form>
</div>

<!-- 主界面 -->
<div id="appView" class="hidden">
  <header class="topbar">
    <div class="brand">rbackup-ui <span id="version" class="ver"></span></div>
    <div class="meta" id="meta"></div>
    <div class="actions">
      <button id="themeBtn" class="ghost theme-btn" title="切换主题（自动/亮/暗）">🌓</button>
      <button id="reloadBtn" class="ghost" title="重新读取配置">重载</button>
      <button id="logoutBtn" class="ghost">退出</button>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <section class="info" id="info"></section>

  <main class="layout">
    <section class="tasks card">
      <div class="card-head">
        <h2>任务列表</h2>
        <div class="toolbar">
          <label class="chk"><input type="checkbox" id="selectAll"> 全选</label>
          <button id="runBtn" class="primary">运行选中</button>
          <button id="dryBtn">Dry-run 预览</button>
          <button id="mountBtn">挂载检查</button>
          <button id="cancelBtn" class="danger hidden">取消运行</button>
        </div>
      </div>
      <div class="table-wrap">
        <table id="taskTable">
          <thead><tr>
            <th class="c-chk"></th><th>任务名</th><th class="c-src">源</th>
            <th class="c-dst">目标</th><th class="c-gate">门禁</th><th class="c-danger">危险</th>
          </tr></thead>
          <tbody id="taskBody"></tbody>
        </table>
        <p id="emptyHint" class="hint hidden">配置中没有任务，或配置加载失败。</p>
      </div>
      <div id="taskCards" class="task-cards"></div>
    </section>

    <section class="log card">
      <div class="card-head">
        <h2>运行日志</h2>
        <div class="toolbar">
          <span id="jobState" class="badge idle">空闲</span>
          <button id="pauseBtn" class="ghost">暂停滚动</button>
          <button id="clearBtn" class="ghost">清屏</button>
        </div>
      </div>
      <pre id="log" class="log-body"></pre>
    </section>
  </main>

  <footer id="stats" class="stats"></footer>
</div>

<!-- 确认弹窗 -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="modalTitle">确认执行</h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button id="modalCancel" class="ghost">取消</button>
      <button id="modalOk" class="danger">确认执行</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
