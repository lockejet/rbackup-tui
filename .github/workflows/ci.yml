name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-build:
    name: Go 构建（三平台）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet .

      - name: 单元测试
        run: go test -v ./...

      - name: 构建当前平台
        run: go build -ldflags "-X main.Version=ci" -o /tmp/rbackup-ui .

      - name: 前端 JS 语法检查
        run: node --check web/app.js

      - name: 三平台交叉编译
        run: |
          set -euo pipefail
          mkdir -p /tmp/rb-ci
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            out="/tmp/rb-ci/rbackup-ui-${os}-${arch}"
            [ "$os" = "windows" ] && out="${out}.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -ldflags "-X main.Version=ci" -o "$out" .
            echo "✓ $out"
          done

      - name: gofmt 提示（不阻塞）
        continue-on-error: true
        run: |
          mapfile -t files < <(gofmt -l main.go config.go runner.go main_test.go web.go webauth.go websec.go qrterm.go web_test.go proc_unix.go proc_windows.go console_windows.go console_other.go)
          if [ "${#files[@]}" -gt 0 ]; then
            echo "::warning::以下文件未通过 gofmt: ${files[*]}"
            gofmt -d "${files[@]}" | head -60
          fi

  windows:
    name: Windows 原生构建/测试/冒烟
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建
        run: go build -ldflags "-X main.Version=ci" -o rbackup-ui.exe .

      - name: 单元测试
        run: go test ./...

      - name: 诊断与 Web 冒烟
        shell: pwsh
        run: |
          .\rbackup-ui.exe --help
          .\rbackup-ui.exe --doctor
          $proc = Start-Process -FilePath .\rbackup-ui.exe -ArgumentList @("--web", "--web-addr", "127.0.0.1:30099") -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 300
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:30099/health" -TimeoutSec 2
                $ok = $true; break
              } catch {}
            }
            if (-not $ok) { throw "Web /health 检查失败" }
            Write-Host "health: $($r.Content)"
            $r2 = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:30099/api/authinfo" -TimeoutSec 3
            Write-Host "authinfo: $($r2.Content)"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: 安装器脚本语法检查（Windows PowerShell 5.1 + UTF-8 BOM）
        shell: powershell
        run: |
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path install.ps1))
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw "install.ps1 缺少 UTF-8 BOM：Windows PowerShell 5.1 会把脚本按 ANSI 解析，中文乱码"
          }
          $null = [scriptblock]::Create((Get-Content install.ps1 -Raw))
          Write-Host "✓ install.ps1 语法 OK（PS 5.1）"


  shell-and-scripts:
    name: Shell 脚本与集成自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: 语法检查（bash -n）
        run: |
          set -euo pipefail
          for f in rbackup.sh install.sh \
                   integrations/lazyrsync/rbackup-gate.sh \
                   integrations/lazyrsync/test-gate.sh; do
            bash -n "$f"
            echo "✓ bash -n $f"
          done

      - name: rbackup.sh 参数冒烟（--help / --print-log-dir）
        run: |
          set -euo pipefail
          # --help 必须可用且退出码为 0（曾因 set -u + heredoc 展开崩溃）
          ./rbackup.sh --help >/dev/null
          echo "✓ --help 可用"

          # 日志目录必须遵循 XDG_STATE_HOME
          dir="$(XDG_STATE_HOME=/tmp/xdg-state ./rbackup.sh --print-log-dir)"
          test "$dir" = "/tmp/xdg-state/rbackup-ui/log" \
            || { echo "✗ XDG 日志目录不符: $dir"; exit 1; }
          echo "✓ XDG 日志目录: $dir"

          # XDG_STATE_HOME 未设置时回退到 ~/.local/state
          dir="$(env -u XDG_STATE_HOME HOME=/tmp/fake-home ./rbackup.sh --print-log-dir)"
          test "$dir" = "/tmp/fake-home/.local/state/rbackup-ui/log" \
            || { echo "✗ XDG 回退目录不符: $dir"; exit 1; }
          echo "✓ XDG 回退目录: $dir"

      - name: shellcheck 新增脚本（阻塞）
        run: shellcheck --severity=error install.sh integrations/lazyrsync/rbackup-gate.sh

      - name: shellcheck 存量脚本（仅提示）
        run: |
          if ! shellcheck rbackup.sh; then
            echo "::warning::rbackup.sh 存在 shellcheck 提示（不阻塞构建）"
          fi

      - name: 安装器行为自测
        run: |
          set -euo pipefail
          HOME="$(mktemp -d)" ./install.sh --help >/dev/null
          echo "✓ --help 可用"

          # 未知参数必须被拒绝
          if HOME="$(mktemp -d)" ./install.sh --bogus >/dev/null 2>&1; then
            echo "✗ 未知参数未被拒绝"; exit 1
          fi
          echo "✓ 未知参数被拒绝"

          # 未安装过就卸载，必须给出明确错误
          if HOME="$(mktemp -d)" ./install.sh --uninstall >/dev/null 2>&1; then
            echo "✗ 无清单时卸载未报错"; exit 1
          fi
          echo "✓ 无清单时卸载正确报错"

          # 不存在的版本必须下载失败而非"安装成功"
          if HOME="$(mktemp -d)" ./install.sh --version v0.0.0-nonexistent >/dev/null 2>&1; then
            echo "✗ 不存在的版本竟然安装成功"; exit 1
          fi
          echo "✓ 不存在的版本被正确拒绝"

      - name: README 目录链接校验
        run: |
          python3 tools/gen-toc.py --check
          python3 tools/gen-ui-preview.py >/dev/null && echo "✓ 界面示意图生成器可运行"

      - name: 挂载门禁集成自测
        run: bash integrations/lazyrsync/test-gate.sh
